/* ================= impresión (render a imagen) =================
   El ticket se dibuja en un canvas del ancho exacto del cabezal
   (384 px = 58 mm, 576 px = 80 mm) y se imprime como imagen al 100 %
   del ancho de la página. Así el tamaño relativo es siempre el mismo,
   sin depender de la escala ni del tamaño de hoja del diálogo. */
const nPed = p => '#'+String(p.num).padStart(3,'0');
const anchoPx = () => S.impresora.papel===80 ? 576 : 384;

function estiloImpresion(){
  const im=S.impresora;
  let el=document.getElementById('printCss');
  if(!el){ el=document.createElement('style'); el.id='printCss'; document.head.appendChild(el); }
  const anchoPct = im.escala||100;
  const off = im.offsetPct||0;              // % del ancho: no se encoge con el escalado del driver
  const alin = im.alinear==='centro' ? '0 auto' : '0';
  el.textContent = `@page{margin:0}
    @media print{#print{width:${anchoPct}%;margin:${alin};transform:translateX(${off}%)}}`;
}
function envolver(ctx,txt,max){
  const out=[]; let linea='';
  String(txt).split(/\s+/).filter(Boolean).forEach(w=>{
    const t=linea?linea+' '+w:w;
    if(ctx.measureText(t).width<=max) linea=t;
    else { if(linea) out.push(linea); linea=w; }
  });
  if(linea) out.push(linea);
  return out.length?out:[''];
}
const fuenteDe = t => t==='comanda' ? (S.impresora.fuentePx||36) : (S.impresora.fuentePxBoleta||24);
function pintarCupon(bloques, fBase){
  const W=anchoPx(), pad=Math.round(W*0.02);
  // Colchón extra a la derecha: evita que la impresora coma los últimos dígitos del total.
  const padR = pad + Math.round(W*(S.impresora.margenDer??8)/100);
  const maxW = W - pad - padR;
  const f=fBase||S.impresora.fuentePx||34;
  const fnt=(s,b)=>`${b?'800':'600'} ${Math.round(s)}px Arial, Helvetica, sans-serif`;
  const med=document.createElement('canvas').getContext('2d');
  const lineas=[];
  bloques.forEach(b=>{
    if(b.t==='hr'){ lineas.push({t:'hr',h:Math.round(f*0.75)}); return; }
    if(b.t==='gap'){ lineas.push({t:'gap',h:b.h||Math.round(f*0.45)}); return; }
    const size=b.size||f, bold=b.bold!==false, ind=b.indent||0;
    med.font=fnt(size,bold);
    if(b.t==='row'){
      const rw=med.measureText(b.r||'').width;
      const partes=envolver(med,b.l,Math.max(f*2, maxW-rw-Math.round(f*0.4)));
      partes.forEach((t,i)=> lineas.push({t:'row',l:t,r:i===partes.length-1?(b.r||''):'',size,bold,h:Math.round(size*1.4)}));
      return;
    }
    envolver(med,b.s,maxW-ind).forEach(t=>
      lineas.push({t:'txt',s:t,size,bold,align:b.align||'left',indent:ind,h:Math.round(size*1.4)}));
  });
  const avance=Math.round((S.impresora.avance||0)*(W/(S.impresora.papel===80?80:58)));
  const H=lineas.reduce((a,l)=>a+l.h,0)+pad*2+avance;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const c=cv.getContext('2d');
  c.fillStyle='#fff'; c.fillRect(0,0,W,H);
  c.fillStyle='#000'; c.textBaseline='top';
  let y=pad;
  lineas.forEach(l=>{
    if(l.t==='hr'){ c.fillRect(pad,y+Math.floor(l.h/2)-2,maxW,Math.max(2,Math.round(f*0.09))); y+=l.h; return; }
    if(l.t==='gap'){ y+=l.h; return; }
    c.font=fnt(l.size,l.bold);
    const yy=y+Math.round((l.h-l.size)*0.35);
    if(l.t==='row'){
      c.textAlign='left'; c.fillText(l.l,pad,yy);
      if(l.r){ c.textAlign='right'; c.fillText(l.r,W-padR,yy); }
    } else if(l.align==='center'){ c.textAlign='center'; c.fillText(l.s,(pad+(W-padR))/2,yy); }
    else { c.textAlign='left'; c.fillText(l.s,pad+l.indent,yy); }
    y+=l.h;
  });
  return cv.toDataURL('image/png');
}
function destinoLineas(p){
  if(p.modo==='delivery') return ['DELIVERY',p.cliente||'Cliente',p.dir,p.fono].filter(Boolean);
  if(p.modo==='local') return ['EN LOCAL · MESA '+(p.mesa||'—')];
  return ['RETIRO',p.cliente||'Cliente',p.fono].filter(Boolean);
}
function bloquesComanda(p){
  const loc=S.locales[p.local], f=S.impresora.fuentePx||34, b=[];
  b.push({t:'txt',s:'COMANDA COCINA',align:'center',size:f*0.9});
  b.push({t:'txt',s:nPed(p),align:'center',size:f*2});
  b.push({t:'txt',s:loc.nombre,align:'center',size:f*0.9});
  b.push({t:'hr'});
  b.push({t:'row',l:new Date(p.creado).toLocaleDateString('es-CL'),r:hora(p.creado),size:f*0.9});
  destinoLineas(p).forEach(l=> b.push({t:'txt',s:l,align:'center',size:f}));
  b.push({t:'hr'});
  p.items.forEach(i=>{
    b.push({t:'txt',s:`${i.q} x ${i.n}`,size:f*1.1});
    (i.det||[]).forEach(d=> b.push({t:'txt',s:'- '+d,size:f*0.85,indent:Math.round(f*0.6)}));
    if(i.nota) b.push({t:'txt',s:'** '+i.nota,size:f*0.85,indent:Math.round(f*0.6)});
    b.push({t:'gap'});
  });
  b.push({t:'hr'});
  b.push({t:'txt',s:p.items.reduce((a,i)=>a+i.q,0)+' producto(s)',align:'center',size:f*0.9});
  return b;
}
function bloquesBoleta(p){
  const loc=S.locales[p.local], f=fuenteDe('boleta'), b=[];
  b.push({t:'txt',s:loc.nombre.toUpperCase(),align:'center',size:f*1.25});
  b.push({t:'txt',s:S.impresora.titulo||'CUENTA',align:'center',size:f*0.9});
  if(loc.dir) b.push({t:'txt',s:loc.dir,align:'center',size:f*0.85});
  b.push({t:'hr'});
  b.push({t:'row',l:'PEDIDO',r:nPed(p),size:f*0.95});
  b.push({t:'row',l:new Date(p.creado).toLocaleDateString('es-CL'),r:hora(p.creado),size:f*0.9});
  b.push({t:'row',l:'MODALIDAD',r:p.modo.toUpperCase(),size:f*0.9});
  if(p.mesa) b.push({t:'row',l:'MESA',r:p.mesa,size:f*0.9});
  if(p.cliente) b.push({t:'txt',s:'CLIENTE: '+p.cliente,size:f*0.9});
  if(p.fono) b.push({t:'txt',s:'FONO: '+p.fono,size:f*0.9});
  if(p.dir) b.push({t:'txt',s:'DIR: '+p.dir,size:f*0.9});
  b.push({t:'hr'});
  p.items.forEach(i=>{
    b.push({t:'row',l:`${i.q} x ${i.n}`,r:CLP(i.p*i.q),size:f});
    (i.det||[]).forEach(d=> b.push({t:'txt',s:'- '+d,size:f*0.8,indent:Math.round(f*0.6)}));
    if(i.nota) b.push({t:'txt',s:'* '+i.nota,size:f*0.8,indent:Math.round(f*0.6)});
  });
  b.push({t:'hr'});
  b.push({t:'row',l:'SUBTOTAL',r:CLP(p.subtotal),size:f*0.95});
  if(p.desc) b.push({t:'row',l:'DCTO '+(p.codigo||''),r:'-'+CLP(p.desc),size:f*0.95});
  if(p.envio) b.push({t:'row',l:'DELIVERY'+(p.zona?' · '+p.zona:''),r:CLP(p.envio),size:f*0.95});
  b.push({t:'gap'});
  b.push({t:'row',l:'TOTAL',r:CLP(p.total),size:f*1.3});
  if(p.pagos&&p.pagos.length>1) p.pagos.forEach(x=> b.push({t:'row',l:x.medio.toUpperCase(),r:CLP(x.monto),size:f*0.9}));
  else if(p.pago) b.push({t:'row',l:'PAGO',r:p.pago.toUpperCase(),size:f*0.9});
  const pct=S.impresora.propina;
  if(pct>0){
    const prop=Math.round(p.total*pct/100);
    b.push({t:'hr'});
    b.push({t:'row',l:`PROPINA SUGERIDA ${pct}%`,r:CLP(prop),size:f*0.9});
    b.push({t:'row',l:'TOTAL CON PROPINA',r:CLP(p.total+prop),size:f*1.1});
  }
  b.push({t:'hr'});
  if(S.impresora.pie) b.push({t:'txt',s:S.impresora.pie,align:'center',size:f*0.85});
  return b;
}
function htmlCupon(bloques, tipo){
  const base=S.impresora.fuentePt||16;
  const pt = tipo==='comanda' ? base : Math.max(6, Math.round(base*(fuenteDe('boleta')/(S.impresora.fuentePx||36))));
  const esc=t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const filas=bloques.map(b=>{
    if(b.t==='hr') return `<div style="border-top:2px dashed #000;margin:.45em 0"></div>`;
    if(b.t==='gap') return `<div style="height:.4em"></div>`;
    const rel=((b.size||36)/(tipo==='comanda'?fuenteDe('comanda'):fuenteDe('boleta'))).toFixed(2);
    const st=`font-size:${rel}em;font-weight:800;line-height:1.3;margin:.12em 0`;
    if(b.t==='row') return `<div style="${st};display:flex;justify-content:space-between;gap:.4em">
      <span>${esc(b.l)}</span><span style="white-space:nowrap">${esc(b.r||'')}</span></div>`;
    const al=b.align==='center'?'text-align:center;':'';
    const ind=b.indent?`padding-left:${(b.indent/36).toFixed(2)}em;`:'';
    return `<div style="${st};${al}${ind}">${esc(b.s)}</div>`;
  }).join('');
  return `<div style="font-family:'Arial Narrow',Arial,sans-serif;color:#000;font-size:${pt}pt;
    font-weight:800;overflow-wrap:anywhere;width:100%">${filas}</div>`;
}
async function imprimir(p, tipo='boleta'){
  const im=S.impresora;
  estiloImpresion();
  const lista = tipo==='ambas' ? ['comanda','boleta'] : [tipo];
  let html='';
  lista.forEach(t=>{
    const copias = t==='comanda' ? (im.copiasComanda||1) : (im.copiasBoleta||1);
    const bl = t==='comanda' ? bloquesComanda(p) : bloquesBoleta(p);
    const cuerpo = im.modo==='texto' ? htmlCupon(bl,t) : `<img src="${pintarCupon(bl, fuenteDe(t))}">`;
    for(let i=0;i<copias;i++) html += `<div class="cupon">${cuerpo}</div>`;
  });
  const cont=$('#print');
  cont.innerHTML = html;
  // Sin esperar la carga, Chrome puede mandar la hoja en blanco.
  const imgs=[...cont.querySelectorAll('img')];
  await Promise.all(imgs.map(el=> el.complete ? Promise.resolve()
    : new Promise(r=>{ el.onload=r; el.onerror=r; setTimeout(r,1500); })));
  try{ window.print(); }
  catch(e){ toast('El navegador bloqueó la impresión: usa "Descargar imagen"'); }
}

/* ================= sonido ================= */
let ctx=null;
function beep(){
  if(!sonido) return;
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='triangle';o.frequency.value=880;
    g.gain.setValueAtTime(.0001,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.3);
    o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.32);
  }catch(e){}
}

function ir(v){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on',s.id==='v-'+v));
  if(v==='cocina')renderCocina(); if(v==='caja')renderCaja();
  if(v==='cuadre')renderCuadre(); if(v==='menu')renderMenuAdmin();
  window.scrollTo(0,0);
}
