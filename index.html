<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Comandera</title>
<style>
  :root{
    --carbon:#1B1E1A; --tinta:#2A2E28; --humo:#EDEEE7; --papel:#FCFBF7; --linea:#D6D8CE;
    --brasa:#E2571E; --verde:#3F7D3A; --ambar:#D99414; --gris:#767B73;
    --mono: ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--humo);color:var(--tinta);font-family:var(--sans);font-size:15px;overscroll-behavior:none}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  :focus-visible{outline:2px solid var(--brasa);outline-offset:2px}

  header{background:var(--carbon);color:#F2F2EC;display:flex;align-items:center;gap:14px;padding:0 14px;height:54px;position:sticky;top:0;z-index:40}
  .brand{font-weight:800;letter-spacing:.16em;font-size:13px;text-transform:uppercase;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .brand i{width:8px;height:8px;border-radius:50%;background:var(--brasa);display:block;animation:latido 2.4s infinite ease-in-out}
  @keyframes latido{0%,100%{opacity:1}50%{opacity:.25}}
  .sel-local{background:#2C302B;color:#F2F2EC;border:1px solid #40453E;border-radius:7px;padding:7px 10px;font-weight:600;max-width:190px}
  nav.tabs{display:flex;gap:2px;margin-left:auto}
  nav.tabs button{color:#9BA096;padding:8px 13px;border-radius:7px;font-weight:650;font-size:13.5px;display:flex;align-items:center;gap:7px}
  nav.tabs button.on{background:#2E332D;color:#fff}
  nav.tabs .badge{background:var(--brasa);color:#fff;border-radius:20px;min-width:19px;height:19px;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
  .campana{color:#9BA096;font-size:17px;padding:6px}
  .campana.on{color:var(--ambar)}

  main{max-width:1400px;margin:0 auto;padding:14px}
  .view{display:none}.view.on{display:block}

  .split{display:grid;grid-template-columns:1fr 372px;gap:14px;align-items:start}
  .cats{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .cats button{border:1px solid var(--linea);background:var(--papel);border-radius:20px;padding:7px 14px;font-weight:650;font-size:13.5px;white-space:nowrap;color:var(--gris)}
  .cats button.on{background:var(--carbon);border-color:var(--carbon);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:9px}
  .prod{background:var(--papel);border:1px solid var(--linea);border-radius:11px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px;transition:transform .08s,border-color .12s}
  .prod:active{transform:scale(.975)}
  .prod:hover{border-color:var(--carbon)}
  .prod .n{font-weight:700;line-height:1.25;font-size:14.5px}
  .prod .d{font-size:11.5px;color:var(--gris);line-height:1.35}
  .prod .p{font-family:var(--mono);font-size:13px;color:var(--brasa);font-weight:700;margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
  .prod .p b{color:var(--gris);font-weight:700}
  h3.cat-t{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--gris);margin:20px 0 9px;font-weight:800}
  h3.cat-t:first-child{margin-top:0}

  .ticket-wrap{position:sticky;top:68px}
  .ticket{background:var(--papel);border:1px solid var(--linea);border-bottom:none;border-radius:11px 11px 0 0;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.03),0 10px 30px -20px rgba(0,0,0,.5)}
  .tear{height:11px;background-repeat:repeat-x;background-size:14px 14px;
    background-image:linear-gradient(45deg,var(--papel) 50%,transparent 51%),linear-gradient(-45deg,var(--papel) 50%,transparent 51%);
    filter:drop-shadow(0 1px 0 var(--linea))}
  .t-head{padding:12px 14px;border-bottom:1px dashed var(--linea)}
  .t-title{font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--gris);display:flex;justify-content:space-between;margin-bottom:10px}
  .seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;background:var(--humo);padding:3px;border-radius:8px}
  .seg button{padding:8px 4px;border-radius:6px;font-weight:700;font-size:13px;color:var(--gris)}
  .seg button.on{background:var(--carbon);color:#fff}
  .campos{display:grid;gap:7px;margin-top:10px}
  .campos input,.campos select{width:100%;border:1px solid var(--linea);border-radius:7px;padding:9px 10px;background:#fff}
  .t-items{max-height:min(38vh,340px);overflow:auto;padding:6px 0}
  .vacio{padding:30px 16px;text-align:center;color:var(--gris);font-size:13.5px;line-height:1.5}
  .li{padding:9px 14px;border-bottom:1px dashed var(--linea)}
  .li .fila{display:flex;gap:8px;align-items:baseline}
  .li .q{font-family:var(--mono);font-weight:800;color:var(--brasa);min-width:24px}
  .li .n{flex:1;font-weight:650;font-size:14px;line-height:1.3}
  .li .sub{font-family:var(--mono);font-size:13.5px;font-weight:600}
  .li .opts{font-size:12px;color:var(--gris);margin:3px 0 0 32px;line-height:1.45}
  .li .acc{display:flex;gap:5px;margin:7px 0 0 32px}
  .li .acc button{border:1px solid var(--linea);border-radius:6px;width:28px;height:26px;font-weight:800;background:#fff;color:var(--tinta);display:grid;place-items:center;font-size:15px}
  .li .acc .edit{width:auto;padding:0 9px;font-size:12px;font-weight:700;color:var(--gris)}
  .t-tot{padding:12px 14px;border-top:1px dashed var(--linea);font-family:var(--mono);font-size:13.5px}
  .t-tot .r{display:flex;justify-content:space-between;padding:3px 0}
  .t-tot .r.big{font-size:20px;font-weight:800;font-family:var(--sans);padding-top:9px;margin-top:6px;border-top:1px solid var(--linea)}
  .codigo{display:flex;gap:6px;margin:9px 0 2px}
  .codigo input{flex:1;border:1px solid var(--linea);border-radius:7px;padding:8px 10px;text-transform:uppercase;background:#fff}
  .codigo button{border:1px solid var(--carbon);background:var(--carbon);color:#fff;border-radius:7px;padding:0 12px;font-weight:700;font-size:13px}
  .enviar{width:100%;background:var(--brasa);color:#fff;font-weight:800;font-size:16px;padding:15px;border-radius:11px;margin-top:10px;box-shadow:0 6px 16px -8px var(--brasa)}
  .enviar[disabled]{background:#C7CAC2;box-shadow:none;cursor:not-allowed}
  .limpiar{width:100%;padding:9px;color:var(--gris);font-size:13px;font-weight:600;margin-top:4px}
  @keyframes feed{0%{transform:translateY(0);opacity:1}55%{transform:translateY(-14px);opacity:.35}56%{transform:translateY(26px);opacity:0}100%{transform:translateY(0);opacity:1}}
  .feeding{animation:feed .55s ease-in-out}

  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .col-h{display:flex;align-items:center;gap:8px;padding:0 3px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:var(--gris)}
  .col-h .c{background:var(--carbon);color:#fff;border-radius:20px;padding:2px 8px;font-size:11px;letter-spacing:0}
  .col-body{display:flex;flex-direction:column;gap:10px;min-height:70px}
  .card{background:var(--papel);border:1px solid var(--linea);border-radius:11px 11px 0 0;overflow:hidden}
  .card.pend{border-left:4px solid var(--ambar)}
  .card.prep{border-left:4px solid var(--brasa)}
  .card.listo{border-left:4px solid var(--verde)}
  .card.tarde{border-color:var(--brasa);box-shadow:0 0 0 2px rgba(226,87,30,.16)}
  .c-top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px dashed var(--linea)}
  .num{font-family:var(--mono);font-weight:800;font-size:17px}
  .modo{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;padding:3px 7px;border-radius:5px;background:var(--humo);color:var(--gris)}
  .modo.delivery{background:#E7EFE6;color:var(--verde)}
  .modo.local{background:#FBEFE5;color:#A8480F}
  .crono{font-family:var(--mono);font-size:12.5px;font-weight:700;color:var(--gris)}
  .crono.tarde{color:var(--brasa)}
  .c-body{padding:10px 12px;font-size:14px}
  .c-body .l{display:flex;gap:8px;padding:2.5px 0;line-height:1.35}
  .c-body .l b{font-family:var(--mono);color:var(--brasa);min-width:22px}
  .c-body .o{font-size:12px;color:var(--gris);margin-left:30px;line-height:1.4}
  .c-meta{font-size:12.5px;color:var(--gris);padding:0 12px 10px;line-height:1.5}
  .c-meta b{color:var(--tinta)}
  .c-acc{display:flex;gap:6px;padding:0 12px 12px}
  .c-acc button{flex:1;padding:11px;border-radius:8px;font-weight:750;font-size:13.5px;background:var(--carbon);color:#fff}
  .c-acc button.sec{background:#fff;border:1px solid var(--linea);color:var(--gris);flex:0 0 auto;padding:11px 12px}
  .c-acc button.go{background:var(--verde)}
  .col-vacia{border:1.5px dashed var(--linea);border-radius:11px;padding:26px 12px;text-align:center;color:var(--gris);font-size:13px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--papel);border:1px solid var(--linea);border-radius:11px;padding:14px}
  .kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--gris);font-weight:800}
  .kpi .v{font-size:27px;font-weight:800;margin-top:5px;letter-spacing:-.02em}
  .kpi.destaca{background:var(--carbon);border-color:var(--carbon);color:#fff}
  .kpi.destaca .k{color:#9BA096}
  .panel{background:var(--papel);border:1px solid var(--linea);border-radius:11px;padding:14px;margin-bottom:12px}
  .panel h4{margin:0 0 11px;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--gris)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--gris);padding:0 8px 8px;font-weight:800}
  td{padding:9px 8px;border-top:1px solid var(--linea)}
  td.mono,th.mono{font-family:var(--mono);text-align:right}
  .barra{height:7px;background:var(--humo);border-radius:4px;overflow:hidden;margin-top:5px}
  .barra i{display:block;height:100%;background:var(--brasa)}
  .acciones{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid var(--linea);background:var(--papel);border-radius:8px;padding:11px 15px;font-weight:700;font-size:13.5px}
  .btn.dark{background:var(--carbon);color:#fff;border-color:var(--carbon)}
  .btn.danger{color:var(--brasa);border-color:var(--brasa)}

  .m-row{display:grid;grid-template-columns:1fr 100px 100px 110px 36px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--linea)}
  .m-row input{border:1px solid transparent;background:transparent;border-radius:6px;padding:7px 8px;width:100%}
  .m-row input:hover{border-color:var(--linea)}
  .m-row input:focus{border-color:var(--carbon);background:#fff}
  .m-row .del{color:var(--gris);font-size:17px;text-align:center}
  .m-row .del:hover{color:var(--brasa)}
  .agregar{display:grid;grid-template-columns:1fr 120px 120px 130px 110px;gap:8px;margin-top:12px}
  .agregar input,.agregar select{border:1px solid var(--linea);border-radius:8px;padding:10px;background:#fff}

  .modal{position:fixed;inset:0;background:rgba(27,30,26,.5);display:none;place-items:center;z-index:60;padding:12px}
  .modal.on{display:grid}
  .modal-box{background:var(--papel);border-radius:14px;width:100%;max-width:460px;max-height:88vh;overflow:auto;padding:18px}
  .modal-box h4{margin:0 0 3px;font-size:19px}
  .modal-box .sb{color:var(--gris);font-size:12.5px;margin-bottom:14px;line-height:1.45}
  .g-t{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--gris);font-weight:800;margin:16px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
  .g-t span{letter-spacing:0;text-transform:none;font-size:11.5px;font-weight:650}
  .ops{display:flex;flex-wrap:wrap;gap:7px}
  .ops button{border:1px solid var(--linea);background:#fff;border-radius:20px;padding:9px 13px;font-size:13.5px;font-weight:600}
  .ops button.on{background:var(--carbon);color:#fff;border-color:var(--carbon)}
  .ops button.tam{border-radius:9px;padding:11px 16px;font-weight:750}
  .ops button.tope{opacity:.4}
  .cnt{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--linea);background:#fff;border-radius:9px;padding:7px 8px 7px 12px;margin-bottom:6px}
  .cnt.on{border-color:var(--carbon)}
  .cnt .cn{flex:1;font-size:13.5px;font-weight:650;line-height:1.25}
  .cnt .cc{display:flex;align-items:center;gap:6px}
  .cnt .cc button{width:30px;height:28px;border:1px solid var(--linea);border-radius:7px;font-weight:800;font-size:16px;display:grid;place-items:center}
  .cnt .cc b{font-family:var(--mono);min-width:16px;text-align:center}
  .modal-box textarea{width:100%;border:1px solid var(--linea);border-radius:8px;padding:10px;min-height:60px;background:#fff;resize:vertical}
  .modal-acc{display:flex;gap:8px;margin-top:18px;position:sticky;bottom:-18px;background:var(--papel);padding:10px 0 0}
  .modal-acc .btn{flex:1;text-align:center;padding:14px}
  .modal-box .num-in{width:100%;border:1px solid var(--linea);border-radius:8px;padding:10px;background:#fff}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--carbon);color:#fff;padding:13px 20px;border-radius:11px;font-weight:650;z-index:80;opacity:0;transition:.28s;pointer-events:none;font-size:14px;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:960px){
    .split{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.ticket-wrap{position:static}
    nav.tabs button span.txt{display:none}nav.tabs button{padding:8px 11px}.brand{font-size:11px}
    .agregar{grid-template-columns:1fr 1fr}
    .m-row{grid-template-columns:1fr 90px 36px;grid-template-areas:"n p d" "x c c"}
    .m-row .xl-in{grid-area:x}.m-row .cat-in{grid-area:c}
  }

  #print{display:none}
  @media print{
    html,body{width:auto;margin:0;padding:0;background:#fff}
    header,main,.toast,.modal{display:none !important}
    #print{display:block;width:100%;margin:0;padding:0}
    #print img{display:block;width:100%;height:auto;image-rendering:pixelated}    #print .cupon{page-break-after:always}
    #print .cupon:last-child{page-break-after:auto}
  }
</style>

<header>
  <div class="brand">COMANDERA <i></i></div>
  <select class="sel-local" id="selLocal"></select>
  <nav class="tabs">
    <button data-v="pedido" class="on">🧾 <span class="txt">Pedido</span></button>
    <button data-v="cocina">🔥 <span class="txt">Cocina</span> <span class="badge" id="bdg">0</span></button>
    <button data-v="caja">💵 <span class="txt">Caja</span></button>
    <button data-v="cuadre">📋 <span class="txt">Cuadre</span></button>
    <button data-v="menu">⚙️ <span class="txt">Menú</span></button>
  </nav>
  <button class="campana" id="btnNube" title="Sincronización">☁️</button>
  <button class="campana on" id="btnSon" title="Aviso sonoro">🔔</button>
</header>

<main>
  <section class="view on" id="v-pedido">
    <div class="split">
      <div>
        <div class="cats" id="cats"></div>
        <div id="menuGrid"></div>
      </div>
      <div class="ticket-wrap">
        <div class="ticket" id="ticket">
          <div class="t-head">
            <div class="t-title"><span id="tNum">PEDIDO —</span><span id="tHora"></span></div>
            <div class="seg" id="seg">
              <button data-m="delivery">Delivery</button>
              <button data-m="local" class="on">En local</button>
              <button data-m="retiro">Retiro</button>
            </div>
            <div class="campos" id="campos"></div>
          </div>
          <div class="t-items" id="tItems"></div>
          <div class="t-tot" id="tTot"></div>
        </div>
        <div class="tear"></div>
        <button class="enviar" id="btnEnviar" disabled>Enviar a cocina</button>
        <button class="limpiar" id="btnLimpiar">Vaciar pedido</button>
      </div>
    </div>
  </section>

  <section class="view" id="v-cocina">
    <div id="cont-nuevos"></div>
    <div class="cols" id="cols"></div>
    <div class="panel" style="margin-top:14px"><h4>Entregados hoy</h4><div id="entregados"></div></div>
  </section>

  <section class="view" id="v-caja"></section>
  <section class="view" id="v-cuadre"></section>
  <section class="view" id="v-menu"></section>
</main>

<div class="modal" id="modal"><div class="modal-box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<div id="print"></div>

<script>
const $ = s => document.querySelector(s);
const CLP = n => '$' + Math.round(n||0).toLocaleString('es-CL');
const hoy = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const hora = t => new Date(t).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
const uid = () => Math.random().toString(36).slice(2,9);
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('on'),2400); }

/* ================= CARTA ALI ALI ================= */
const SW = (n,d,m,xl)=>({id:uid(),cat:'Shawarmas',n,d,precios:{M:m,XL:xl},mods:['proteina','salsas']});
const PR = (n,d,p)=>({id:uid(),cat:'Premium',n,d,precios:{XL:p},mods:['proteina','salsas'],salsasMax:2,salsasTxt:'Incluye 2 salsas'});

function menuAliAli(){ return [
  // --- Promociones (shawarmas a elección excepto Gyro y Agus) ---
  {id:uid(),cat:'Promociones',n:'1. Ali Ali',d:'2 shawarmas XL · 3 salsas · falafel (6 un.) · 1 kibbe',precios:{U:17600},mods:[],elige:[{tipo:'shawarma',n:2,tam:'XL'},{tipo:'salsa',n:3}]},
  {id:uid(),cat:'Promociones',n:'2. Palestina',d:'2 shawarmas medianos · 3 salsas · falafel (6 un.) · papas fritas',precios:{U:16500},mods:[],elige:[{tipo:'shawarma',n:2,tam:'M'},{tipo:'salsa',n:3}]},
  {id:uid(),cat:'Promociones',n:'3. Sadam',d:'2 shawarmas XL · 4 salsas · falafel (6 un.) · 2 kibbe · papas fritas',precios:{U:20700},mods:[],elige:[{tipo:'shawarma',n:2,tam:'XL'},{tipo:'salsa',n:4}]},
  {id:uid(),cat:'Promociones',n:'4. Asalam Alaikum',d:'2 shawarmas XL · 5 salsas · falafel (6 un.) · 2 kibbe · papas fritas · hojas de parra',precios:{U:23700},mods:[],elige:[{tipo:'shawarma',n:2,tam:'XL'},{tipo:'salsa',n:5}]},
  {id:uid(),cat:'Promociones',n:'5. Solo, Solín, Solito',d:'1 shawarma XL · 2 salsas · papas fritas individual · lata de bebida',precios:{U:9600},mods:[],elige:[{tipo:'shawarma',n:1,tam:'XL'},{tipo:'salsa',n:2},{tipo:'bebida',n:1,fmt:'lata'}]},
  {id:uid(),cat:'Promociones',n:'6. Dulce Tentación',d:'2 shawarmas XL · 2 salsas · 2 latas · 2 pastel o postre del día',precios:{U:17200},mods:[],elige:[{tipo:'shawarma',n:2,tam:'XL'},{tipo:'salsa',n:2},{tipo:'bebida',n:2,fmt:'lata'}]},
  {id:uid(),cat:'Promociones',n:'7. Trío Comestible',d:'3 shawarmas XL · 3 salsas · bebida 1,5 lt',precios:{U:23800},mods:[],elige:[{tipo:'shawarma',n:3,tam:'XL'},{tipo:'salsa',n:3},{tipo:'bebida',n:1,fmt:'1,5 lt'}]},
  {id:uid(),cat:'Promociones',n:'8. Dubai',d:'4 shawarmas XL · 8 salsas · 2 falafel (6 un.) · 2 kibbe · papas · hojas de parra · 2 verduras rellenas · salsa grande · bebida 1,5 lt',precios:{U:50000},mods:[],elige:[{tipo:'shawarma',n:4,tam:'XL'},{tipo:'salsa',n:8},{tipo:'bebida',n:1,fmt:'1,5 lt'}]},

  // --- Shawarmas ---
  SW('1. Clásico','proteína, lechuga, tomate',6600,7200),

async function escribir(txt){
  let ok=false;
  try{ localStorage.setItem(CLAVE,txt); ok=true; }catch(e){}
  if(window.storage&&window.storage.set){ try{ await window.storage.set(CLAVE,txt); ok=true; }catch(e){} }
  if(ok){ ultimoGuardado=Date.now(); fallosGuardado=0; } else { fallosGuardado++; }
  return ok;
}

/* ================= NUBE (Firebase Firestore) =================
   Los pedidos viven cada uno en su propio documento, así dos equipos
   pueden trabajar a la vez sin pisarse. La configuración (carta,
   ajustes, cuadres) va en un documento aparte, el último que escribe manda.
   Firestore guarda en el equipo, así que sigue funcionando sin internet
   y sube todo solo cuando vuelve la señal. */
let db=null, nubeLista=false, desuscribir=null, aplicandoNube=false;
let subidos={}, ultimaNube=null, errorNube='', configTs=0;

function cfgNube(){ if(!S.nube) S.nube={apiKey:'',proyecto:'',tienda:'',activo:false}; return S.nube; }
function estadoNube(){
  const n=cfgNube();
  if(!n.activo) return 'Desactivada';
  if(errorNube) return 'Error: '+errorNube;
  if(!nubeLista) return 'Conectando…';
  return 'Conectada'+(ultimaNube?' · '+hora(ultimaNube):'');
}
function cargarScript(src){
  return new Promise((ok,mal)=>{
    if([...document.scripts].some(x=>x.src===src)) return ok();
    const t=document.createElement('script'); t.src=src; t.onload=ok; t.onerror=()=>mal(new Error('no se pudo cargar Firebase')); document.head.appendChild(t);
  });
}
async function iniciarNube(){
  const n=cfgNube();
  if(desuscribir){ desuscribir(); desuscribir=null; }
  nubeLista=false; errorNube='';
  if(!n.activo || !n.apiKey || !n.proyecto || !n.tienda) return;
  try{
    const V='10.12.2';
    await cargarScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
    await cargarScript(`https://www.gstatic.com/firebasejs/${V}/firebase-auth-compat.js`);
    await cargarScript(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`);
    if(!firebase.apps.length){
      firebase.initializeApp({apiKey:n.apiKey, authDomain:`${n.proyecto}.firebaseapp.com`,
        projectId:n.proyecto, storageBucket:`${n.proyecto}.appspot.com`});
    }
    await firebase.auth().signInAnonymously().catch(()=>{});
    db=firebase.firestore();
    try{ await db.enablePersistence({synchronizeTabs:true}); }catch(e){}
    escucharNube();
    nubeLista=true; ultimaNube=Date.now();
    if($('#v-menu').classList.contains('on')) renderMenuAdmin();
  }catch(e){
    errorNube=String(e.message||e);
    if($('#v-menu').classList.contains('on')) renderMenuAdmin();
  }
}
const refTienda = ()=> db.collection('comanderas').doc(cfgNube().tienda);

function escucharNube(){
  const desde=new Date(Date.now()-1000*60*60*24*45).toISOString().slice(0,10); // 45 días
  const unPed = refTienda().collection('pedidos').where('fecha','>=',desde)
    .onSnapshot(snap=>{
      aplicandoNube=true; let cambios=0, nuevos=0;
      snap.docChanges().forEach(ch=>{
        const d=ch.doc.data();
        const ix=S.pedidos.findIndex(x=>x.id===d.id);
        if(ch.type==='removed'){ if(ix>=0){ S.pedidos.splice(ix,1); cambios++; } return; }
        if(ix<0){ S.pedidos.push(d); cambios++; nuevos++; }
        else if(JSON.stringify(S.pedidos[ix])!==JSON.stringify(d)){ S.pedidos[ix]=d; cambios++; }
        subidos[d.id]=JSON.stringify(d);
      });
      aplicandoNube=false; ultimaNube=Date.now();
      if(cambios){
        // que la numeración local no choque con la de otro equipo
        Object.keys(S.locales).forEach(k=>{
          const mx=S.pedidos.filter(x=>x.local===k).reduce((a,x)=>Math.max(a,x.num||0),0);
          if(mx>(S.locales[k].num||0)) S.locales[k].num=mx;
        });
        guardar();
        if($('#v-cocina').classList.contains('on')) renderCocina();
        if($('#v-caja').classList.contains('on')) renderCaja();
        if($('#v-cuadre').classList.contains('on')) renderCuadre();
        pintarBadge();
        if(nuevos && !snap.metadata.hasPendingWrites) beep();
      }
    }, err=>{ errorNube=err.code||String(err); });

  const unCfg = refTienda().collection('config').doc('general')
    .onSnapshot(doc=>{
      if(!doc.exists) return;
      const d=doc.data();
      if((d.ts||0)<=configTs) return;
      configTs=d.ts||0;
      aplicandoNube=true;
      if(d.locales) S.locales=JSON.parse(d.locales);
      if(d.cuadres) S.cuadres=JSON.parse(d.cuadres);
      if(d.impresora) S.impresora=Object.assign(S.impresora,JSON.parse(d.impresora));
      if(d.codigos) S.codigos=JSON.parse(d.codigos);
      if(d.pagos) S.pagos=JSON.parse(d.pagos);
      aplicandoNube=false;
      guardar();
      const act=document.querySelector('nav.tabs button.on');
      if(act) ir(act.dataset.v);
    }, err=>{ errorNube=err.code||String(err); });

  desuscribir=()=>{ unPed(); unCfg(); };
}

// Sube lo que cambió. Se llama después de cada guardado local.
async function subirNube(){
  if(!db || !nubeLista || aplicandoNube) return;
  try{
    const col=refTienda().collection('pedidos');
    const vivos={};
    const recientes=S.pedidos.filter(p=>p.fecha>=new Date(Date.now()-1000*60*60*24*45).toISOString().slice(0,10));
    let lote=db.batch(), n=0;
    recientes.forEach(p=>{
      vivos[p.id]=1;
      const j=JSON.stringify(p);
      if(subidos[p.id]===j) return;
      lote.set(col.doc(p.id), JSON.parse(j)); subidos[p.id]=j; n++;
    });
    Object.keys(subidos).forEach(id=>{
      if(!vivos[id]){ lote.delete(col.doc(id)); delete subidos[id]; n++; }
    });
    if(n){ await lote.commit(); ultimaNube=Date.now(); }
  }catch(e){ errorNube=e.code||String(e.message||e); }
}
let tCfgNube=null;
function subirConfigNube(){
  if(!db || !nubeLista || aplicandoNube) return;
  clearTimeout(tCfgNube);
  tCfgNube=setTimeout(async()=>{
    try{
      configTs=Date.now();
      await refTienda().collection('config').doc('general').set({
        ts:configTs, locales:JSON.stringify(S.locales), cuadres:JSON.stringify(S.cuadres||{}),
        impresora:JSON.stringify(S.impresora), codigos:JSON.stringify(S.codigos), pagos:JSON.stringify(S.pagos)
      });
      ultimaNube=Date.now();
    }catch(e){ errorNube=e.code||String(e.message||e); }
  },1200);
}

service cloud.firestore {

function copiar(txt,msg){
  navigator.clipboard.writeText(txt).then(()=>toast(msg||'Copiado')).catch(()=>{
    const t=document.createElement('textarea'); t.value=txt; document.body.appendChild(t);
    t.select(); try{document.execCommand('copy'); toast(msg||'Copiado');}catch(e){toast('Cópialo a mano');}

/* ================= modal de configuración ================= */
function abrirConfig(prod, item, onLinea, onCancelar){
  const loc=L();
  const tams=Object.keys(prod.precios);
  const eligeSw=(prod.elige||[]).find(e=>e.tipo==='shawarma');
  const eligeSalsa=(prod.elige||[]).find(e=>e.tipo==='salsa');
  const eligeBebida=(prod.elige||[]).find(e=>e.tipo==='bebida');
  const usaAgregados=(prod.mods||[]).includes('agregados') && (loc.agregados||[]).length;
  const maxSalsa = eligeSalsa ? eligeSalsa.n : (prod.salsasMax||null);
  const usaSalsa = (prod.mods||[]).includes('salsas') || !!eligeSalsa;
  const usaProt = (prod.mods||[]).includes('proteina');

  const cfg = item ? JSON.parse(JSON.stringify(item.cfg)) : {
    tam: tams[0], agregados:{}, prot: usaProt ? ((prod.protFiltro
      ? loc.proteinas.filter(p=> prod.protFiltro.some(f=> p.n.toLowerCase().includes(f)))
      : loc.proteinas)[0]||loc.proteinas[0]||{}).n||'' : '', salsas:{}, bebidas:{}, swList:[], extras:[], nota:'', recargo:0
  };
  if(!cfg.bebidas) cfg.bebidas={};
  if(!cfg.agregados) cfg.agregados={};
  if(Array.isArray(cfg.salsas)){ const o={}; cfg.salsas.forEach(s=>o[s]=(o[s]||0)+1); cfg.salsas=o; }
  if(!cfg.salsas) cfg.salsas={};
  const protDef = loc.proteinas.length ? loc.proteinas[0].n : '';
  if(!cfg.swList){ // versiones anteriores guardaban solo el conteo
    cfg.swList=[]; Object.entries(cfg.sw||{}).forEach(([n,q])=>{ for(let i=0;i<q;i++) cfg.swList.push({n,prot:protDef}); });
  }
  delete cfg.sw;
  const swCandidatos = eligeSw ? loc.menu.filter(p=>['Shawarmas','Premium'].includes(p.cat)) : [];

  const recPrem = loc.recargoPremium || 0;
  const esPremium = n => swCandidatos.some(s=> s.n===n && s.cat==='Premium');
  const sinRecProt = !!prod.sinRecargoProt;
  const protsDisp = prod.protFiltro
    ? loc.proteinas.filter(p=> prod.protFiltro.some(f=> p.n.toLowerCase().includes(f)))
    : loc.proteinas;
  const precioProt = n => sinRecProt ? 0 : (loc.proteinas.find(x=>x.n===n)?.p || 0);
  function extraPremium(){ return cfg.swList.reduce((a,it)=> a + (esPremium(it.n)?recPrem:0), 0); }
  function extraProtSw(){ return cfg.swList.reduce((a,it)=> a + precioProt(it.prot), 0); }
  function precioUnit(){
    const base = prod.precios[cfg.tam] ?? Object.values(prod.precios)[0];
    const pr = usaProt ? precioProt(cfg.prot) : 0;
    return base + pr + extraPremium() + extraProtSw() + extraAgregados() + (cfg.recargo||0);
  }
  function nSw(){ return cfg.swList.length; }
  function cuentaSw(n){ return cfg.swList.filter(x=>x.n===n).length; }
  function nSalsas(){ return Object.values(cfg.salsas).reduce((a,b)=>a+b,0); }
  function nBebidas(){ return Object.values(cfg.bebidas).reduce((a,b)=>a+b,0); }
  const precioAgregado = n => (loc.agregados||[]).find(a=>a.n===n)?.p || 0;
  function extraAgregados(){ return Object.entries(cfg.agregados).reduce((a,[n,q])=>a+precioAgregado(n)*q,0); }

  function pinta(){
    const faltaSw = eligeSw ? Math.max(0, eligeSw.n - nSw()) : 0;
    const faltaSalsa = maxSalsa ? Math.max(0, maxSalsa - nSalsas()) : 0;
    const faltaBebida = eligeBebida ? Math.max(0, eligeBebida.n - nBebidas()) : 0;
    const incompleto = faltaSw>0 || faltaSalsa>0 || faltaBebida>0;
    const aviso = faltaSw>0 ? `Faltan ${faltaSw} shawarma(s) por elegir`
                : faltaSalsa>0 ? `Faltan ${faltaSalsa} salsa(s) por elegir`
                : faltaBebida>0 ? `Falta elegir ${faltaBebida} bebida(s)` : '';
    $('#modalBox').innerHTML = `
      <h4>${prod.n}</h4>
      <div class="sb">${prod.d||''}</div>

      ${tams.length>1 ? `<div class="g-t">Tamaño</div>
        <div class="ops">${tams.map(t=>`<button class="tam ${cfg.tam===t?'on':''}" data-tam="${t}">${t} · ${CLP(prod.precios[t])}</button>`).join('')}</div>`:''}

      ${usaProt ? `<div class="g-t">Proteína${sinRecProt?' <span>a elección, sin recargo</span>':''}</div>
        <div class="ops">${protsDisp.map(p=>`<button class="${cfg.prot===p.n?'on':''}" data-prot="${p.n}">${p.n}${p.p&&!sinRecProt?` +${CLP(p.p)}`:''}</button>`).join('')}</div>`:''}

      ${eligeSw ? `<div class="g-t">Shawarmas de la promo <span>${nSw()} de ${eligeSw.n}${eligeSw.tam?' · tamaño '+eligeSw.tam:''}${extraPremium()?' · premium +'+CLP(extraPremium()):''}</span></div>
        <div style="max-height:220px;overflow:auto;padding-right:2px">
        ${swCandidatos.map(s=>`<div class="cnt ${cuentaSw(s.n)?'on':''}">
            <span class="cn">${s.n}${s.cat==='Premium'&&recPrem?` <span style="color:var(--brasa);font-weight:800">+${CLP(recPrem)}</span>`:''}</span>
            <span class="cc"><button data-sw="-" data-n="${s.n}">−</button><b>${cuentaSw(s.n)}</b><button data-sw="+" data-n="${s.n}">+</button></span>
          </div>`).join('')}</div>

        ${cfg.swList.length && loc.proteinas.length ? `<div class="g-t">Proteína de cada shawarma${extraProtSw()?` <span>+${CLP(extraProtSw())}</span>`:''}</div>
        ${cfg.swList.map((it,ix)=>`<div class="cnt on" style="align-items:center">
            <span class="cn">${ix+1}. ${it.n}</span>
            <select data-swprot="${ix}" style="border:1px solid var(--linea);border-radius:7px;padding:8px;background:#fff;max-width:54%;font-weight:600">
              ${loc.proteinas.map(pr=>`<option value="${pr.n}" ${it.prot===pr.n?'selected':''}>${pr.n}${pr.p?` +${CLP(pr.p)}`:''}</option>`).join('')}
            </select>
          </div>`).join('')}`:''}` : ''}

      ${usaAgregados ? `<div class="g-t">Agregados${extraAgregados()?` <span>+${CLP(extraAgregados())}</span>`:''}</div>
        ${loc.agregados.map(a=>`<div class="cnt ${cfg.agregados[a.n]?'on':''}">
            <span class="cn">${a.n} <span style="color:var(--brasa);font-weight:800">+${CLP(a.p)}</span></span>
            <span class="cc"><button data-ag="-" data-a="${a.n}">−</button><b>${cfg.agregados[a.n]||0}</b><button data-ag="+" data-a="${a.n}">+</button></span>
          </div>`).join('')}`:''}

      ${usaSalsa ? `<div class="g-t">Salsas <span>${nSalsas()}${maxSalsa?' de '+maxSalsa:''}${prod.salsasTxt?' · '+prod.salsasTxt:''}</span></div>
        ${loc.salsas.map(s=>`<div class="cnt ${cfg.salsas[s]?'on':''}">
            <span class="cn">${s}</span>
            <span class="cc"><button data-sa="-" data-s="${s}">−</button><b>${cfg.salsas[s]||0}</b><button data-sa="+" data-s="${s}">+</button></span>
          </div>`).join('')}`:''}

      ${eligeBebida && (loc.bebidas||[]).length ? `<div class="g-t">Bebida de la promo <span>${nBebidas()} de ${eligeBebida.n}${eligeBebida.fmt?' · '+eligeBebida.fmt:''}</span></div>
        ${loc.bebidas.map(bb=>`<div class="cnt ${cfg.bebidas[bb]?'on':''}">
            <span class="cn">${bb}</span>
            <span class="cc"><button data-be="-" data-b="${bb}">−</button><b>${cfg.bebidas[bb]||0}</b><button data-be="+" data-b="${bb}">+</button></span>
          </div>`).join('')}`:''}

      ${loc.extras.length?`<div class="g-t">Indicaciones</div>
        <div class="ops">${loc.extras.map(e=>`<button class="${cfg.extras.includes(e)?'on':''}" data-ex="${e}">${e}</button>`).join('')}</div>`:''}

      <div class="g-t">Nota para la cocina</div>
      <textarea id="nota" placeholder="Ej: proteínas distintas por shawarma, sin ají, etc.">${cfg.nota}</textarea>

      ${admin?`<div class="g-t">Recargo extra</div>
      <input id="recargo" class="num-in" type="number" min="0" step="100" value="${cfg.recargo||0}">`:''}

      <div class="modal-acc">
        <button class="btn" id="mCancel">Cancelar</button>
        <button class="btn ${incompleto?'':'dark'}" id="mOk" ${incompleto?'disabled style="opacity:.45;cursor:not-allowed"':''}>
          ${incompleto ? aviso : `${item?'Guardar':'Agregar'} · ${CLP(precioUnit())}`}</button>
      </div>
      ${incompleto?`<div style="color:var(--brasa);font-size:12.5px;margin-top:8px;text-align:center;font-weight:650">${aviso}</div>`:''}`;

    const box=$('#modalBox');
    box.querySelectorAll('[data-tam]').forEach(b=> b.onclick=()=>{ cfg.tam=b.dataset.tam; guardarCampos(); pinta(); });
    box.querySelectorAll('[data-prot]').forEach(b=> b.onclick=()=>{ cfg.prot=b.dataset.prot; guardarCampos(); pinta(); });
    box.querySelectorAll('[data-sa]').forEach(b=> b.onclick=()=>{
      const s=b.dataset.s;
      if(b.dataset.sa==='+'){
        if(maxSalsa && nSalsas()>=maxSalsa) return toast('Esta opción trae '+maxSalsa+' salsa(s)');
        cfg.salsas[s]=(cfg.salsas[s]||0)+1;
      } else { cfg.salsas[s]=Math.max(0,(cfg.salsas[s]||0)-1); if(!cfg.salsas[s]) delete cfg.salsas[s]; }
      guardarCampos(); pinta();
    });
    box.querySelectorAll('[data-ex]').forEach(b=> b.onclick=()=>{
      const e=b.dataset.ex;
      cfg.extras = cfg.extras.includes(e) ? cfg.extras.filter(x=>x!==e) : [...cfg.extras,e];
      guardarCampos(); pinta();
    });
    box.querySelectorAll('[data-ag]').forEach(b=> b.onclick=()=>{
      const n=b.dataset.a;
      if(b.dataset.ag==='+') cfg.agregados[n]=(cfg.agregados[n]||0)+1;
      else { cfg.agregados[n]=Math.max(0,(cfg.agregados[n]||0)-1); if(!cfg.agregados[n]) delete cfg.agregados[n]; }
      guardarCampos(); pinta();
    });
    box.querySelectorAll('[data-be]').forEach(b=> b.onclick=()=>{
      const bb=b.dataset.b;
      if(b.dataset.be==='+'){
        if(nBebidas()>=eligeBebida.n) return toast('La promo trae '+eligeBebida.n+' bebida(s)');
        cfg.bebidas[bb]=(cfg.bebidas[bb]||0)+1;
      } else { cfg.bebidas[bb]=Math.max(0,(cfg.bebidas[bb]||0)-1); if(!cfg.bebidas[bb]) delete cfg.bebidas[bb]; }
      guardarCampos(); pinta();
    });
    box.querySelectorAll('[data-sw]').forEach(b=> b.onclick=()=>{
      const n=b.dataset.n;
      if(b.dataset.sw==='+'){
        if(nSw()>=eligeSw.n) return toast('La promo trae '+eligeSw.n+' shawarma(s)');
        cfg.swList.push({n, prot:protDef});
      } else {
        const ix=cfg.swList.map(x=>x.n).lastIndexOf(n);
        if(ix>=0) cfg.swList.splice(ix,1);
      }
      guardarCampos(); pinta();
    });
    box.querySelectorAll('[data-swprot]').forEach(sel=> sel.onchange=()=>{
      cfg.swList[+sel.dataset.swprot].prot=sel.value; guardarCampos(); pinta();
    });
    $('#mCancel').onclick = ()=>{ cerrarModal(); if(onCancelar) onCancelar(); };
    $('#mOk').onclick = ()=>{
      guardarCampos();
      if(incompleto) return toast(aviso);
      if(usaProt && !cfg.prot) return toast('Elige la proteína');
      confirmar();
    };
    function guardarCampos(){
      const n=$('#nota'), r=$('#recargo');
      if(n) cfg.nota=n.value;
      if(r) cfg.recargo=Math.max(0,parseInt(r.value)||0);
    }
  }

  function confirmar(){
    const det=[];
    if(cfg.prot) det.push(cfg.prot);
    cfg.swList.forEach((it,ix)=>{
      const rp = esPremium(it.n)&&recPrem ? ` (premium +${CLP(recPrem)})` : '';
      const pp = precioProt(it.prot) ? ` (+${CLP(precioProt(it.prot))})` : '';
      det.push(`${ix+1}. ${it.n}${eligeSw.tam?' '+eligeSw.tam:''} · ${it.prot}${pp}${rp}`);
    });
    if(Object.keys(cfg.salsas).length) det.push('Salsas: '+Object.entries(cfg.salsas).map(([s,q])=> q>1?`${q}× ${s}`:s).join(', '));
    if(Object.keys(cfg.agregados).length) det.push(...Object.entries(cfg.agregados).map(([n,q])=>
      `${q>1?q+'× ':''}${n} (+${CLP(precioAgregado(n)*q)})`));
    if(Object.keys(cfg.bebidas).length) det.push(`Bebida${eligeBebida&&eligeBebida.fmt?' ('+eligeBebida.fmt+')':''}: `+
      Object.entries(cfg.bebidas).map(([b,q])=> q>1?`${q}× ${b}`:b).join(', '));
    if(cfg.extras.length) det.push(...cfg.extras);
    const nombre = (tams.length>1 && cfg.tam!=='U') ? `${prod.n} ${cfg.tam}` : prod.n;
    const base = prod.precios[cfg.tam] ?? Object.values(prod.precios)[0];
    const pr = usaProt ? precioProt(cfg.prot) : 0;
    const linea = {k:item?item.k:uid(), pid:prod.id, n:nombre, p:base+pr+extraPremium()+extraProtSw()+extraAgregados()+(cfg.recargo||0),
                   q:item?item.q:1, det, nota:cfg.nota.trim(), cfg};
    if(onLinea){ cerrarModal(); onLinea(linea); return; }
    if(item) Object.assign(item, linea);
    else draft.items.push(linea);
    cerrarModal(); renderTicket();
  }

  pinta();
  $('#modal').classList.add('on');
}
function cerrarModal(){ $('#modal').classList.remove('on'); $('#modalBox').innerHTML=''; }
$('#modal').onclick = e=>{ if(e.target.id==='modal') cerrarModal(); };

/* ================= ticket ================= */
function renderCampos(){
  const d=draft; let h='';
  if(d.modo==='delivery'){
    const zs=L().zonas||[];
    h=`<input id="f-cli" placeholder="Nombre del cliente" value="${d.cliente}">
       <input id="f-fono" placeholder="Teléfono / WhatsApp" inputmode="tel" value="${d.fono}">
       <input id="f-dir" placeholder="Dirección de entrega" value="${d.dir}">
       <select id="f-zona">${zs.map((z,i)=>`<option value="${i}" ${d.zona===i?'selected':''}>${z.n} · ${CLP(z.p)}</option>`).join('')}</select>
       ${L().origen?`<button id="f-maps" style="text-align:left;font-size:12.5px;color:var(--gris);font-weight:650;padding:2px 2px 0">📍 Ver distancia desde ${L().origen}</button>`:''}`;
  } else if(d.modo==='local'){
    h=`<input id="f-mesa" placeholder="Mesa o número de cliente" value="${d.mesa}">`;
  } else {
    h=`<input id="f-cli" placeholder="Nombre de quien retira" value="${d.cliente}">
       <input id="f-fono" placeholder="Teléfono (opcional)" inputmode="tel" value="${d.fono}">`;
  }
  h+=`<select id="f-pago"><option value="">Método de pago (opcional)</option>${S.pagos.map(p=>`<option ${d.pago===p?'selected':''}>${p}</option>`).join('')}</select>`;
  $('#campos').innerHTML=h;
  const bind=(sel,key)=>{const el=$(sel); if(el) el.oninput=e=>d[key]=e.target.value;};
  bind('#f-cli','cliente');bind('#f-fono','fono');bind('#f-dir','dir');bind('#f-mesa','mesa');
  const pg=$('#f-pago'); if(pg) pg.onchange=e=>d.pago=e.target.value;
  const zn=$('#f-zona'); if(zn) zn.onchange=e=>{ d.zona=+e.target.value; renderTicket(); };
  const mp=$('#f-maps'); if(mp) mp.onclick=()=>{
    if(!d.dir.trim()) return toast('Escribe primero la dirección');
    window.open('https://www.google.com/maps/dir/'+encodeURIComponent(L().origen)+'/'+encodeURIComponent(d.dir.trim()),'_blank');
  };
}
function renderTicket(){
  const d=draft;
  $('#tNum').textContent='PEDIDO N° '+String((L().num||0)+1).padStart(3,'0');
  $('#tHora').textContent=new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
  $('#seg').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===d.modo));

  $('#tItems').innerHTML = d.items.length ? d.items.map(i=>`
    <div class="li">
      <div class="fila"><span class="q">${i.q}×</span><span class="n">${i.n}</span><span class="sub">${CLP(i.p*i.q)}</span></div>
      ${i.det.length?`<div class="opts">${i.det.join(' · ')}</div>`:''}
      ${i.nota?`<div class="opts">📝 ${i.nota}</div>`:''}
      <div class="acc">
        <button data-m="-" data-k="${i.k}">−</button>
        <button data-m="+" data-k="${i.k}">+</button>
        <button class="edit" data-m="e" data-k="${i.k}">Editar</button>
        <button class="edit" data-m="x" data-k="${i.k}">Quitar</button>
      </div>
    </div>`).join('') : `<div class="vacio">Toca un producto para empezar.</div>`;

  $('#tItems').querySelectorAll('button').forEach(b=> b.onclick=()=>{
    const i=d.items.find(x=>x.k===b.dataset.k); if(!i) return;
    if(b.dataset.m==='+') i.q++;
    if(b.dataset.m==='-'){ i.q--; if(i.q<=0) d.items=d.items.filter(x=>x.k!==i.k); }
    if(b.dataset.m==='x') d.items=d.items.filter(x=>x.k!==i.k);
    if(b.dataset.m==='e'){
      const prod=L().menu.find(p=>p.id===i.pid);
      if(!prod) return toast('Ese producto ya no está en la carta');
      if(!i.cfg) return toast('Este producto no tiene opciones');
      return abrirConfig(prod,i);
    }
    renderTicket();
  });

  $('#tTot').innerHTML=`
    <div class="r"><span>Subtotal</span><span>${CLP(subtotal())}</span></div>
    ${d.pct?`<div class="r" style="color:var(--verde)"><span>Descuento ${d.pct}%</span><span>−${CLP(descuento())}</span></div>`:''}
    ${envio()?`<div class="r"><span>Delivery · ${zonaActual()?zonaActual().n:''}</span><span>${CLP(envio())}</span></div>`:''}
    <div class="codigo"><input id="f-cod" placeholder="Código de descuento" value="${d.codigo}"><button id="btnCod">Aplicar</button></div>
    <div class="r big"><span>Total</span><span>${CLP(total())}</span></div>`;
  $('#btnCod').onclick=()=>{
    const v=($('#f-cod').value||'').trim().toUpperCase().replace(/\s+/g,' ');
    if(!v){ d.codigo='';d.pct=0;renderTicket();return; }
    const c=S.codigos.find(x=>x.c.toUpperCase().replace(/\s+/g,' ')===v);
    if(c){ d.codigo=c.c; d.pct=c.pct; toast('Código aplicado: −'+c.pct+'%'); }
    else { d.codigo=''; d.pct=0; toast('Ese código no existe'); }
    renderTicket();
  };
  $('#btnEnviar').disabled = d.items.length===0;
  renderCampos();
}

/* ================= enviar ================= */
function enviar(){
  const d=draft;
  if(!d.items.length) return;
  if(d.modo==='delivery' && !d.dir.trim()){ toast('Falta la dirección de entrega'); $('#f-dir')?.focus(); return; }
  const loc=L(); loc.num=(loc.num||0)+1;
  S.pedidos.push({
    id:uid(),num:loc.num,local:S.local,fecha:hoy(),
    modo:d.modo,cliente:d.cliente.trim(),fono:d.fono.trim(),dir:d.dir.trim(),mesa:d.mesa.trim(),
    items:d.items.map(i=>({n:i.n,q:i.q,p:i.p,det:i.det,nota:i.nota})),
    subtotal:subtotal(),pct:d.pct,codigo:d.codigo,desc:descuento(),envio:envio(),
    zona:d.modo==='delivery'&&zonaActual()?zonaActual().n:'',total:total(),
    pago:d.pago,estado:'pendiente',creado:Date.now(),tiempos:{},cerrado:false
  });
  const recien = S.pedidos[S.pedidos.length-1];
  $('#ticket').classList.add('feeding');
  setTimeout(()=>$('#ticket').classList.remove('feeding'),560);
  beep(); toast('Pedido N° '+String(loc.num).padStart(3,'0')+' enviado a cocina');
  nuevoDraft(); renderTicket(); pintarBadge(); guardarYa();
  if(S.impresora.auto && S.impresora.auto!=='no') setTimeout(()=>imprimir(recien, S.impresora.auto), 200);
}


/* ================= pedidos web (Shopify) ================= */
let tWeb=null, sincronizando=false, ultimoWeb=null, errorWeb='';
function cfgWeb(){ if(!S.web) S.web={url:'',clave:'',activo:false,seg:15}; return S.web; }
function pedidosNuevos(){ return S.pedidos.filter(p=>p.local===S.local && p.estado==='nuevo'); }

async function sincronizarWeb(silencioso){
  const w=cfgWeb();
  if(!w.activo || !w.url || !w.clave || sincronizando) return;
  sincronizando=true;
  try{
    const r=await fetch(w.url.replace(/\/$/,'')+'/pedidos?clave='+encodeURIComponent(w.clave));
    if(!r.ok) throw new Error('respuesta '+r.status);
    const d=await r.json();
    let nuevos=0;
    (d.pedidos||[]).forEach(o=>{
      if(S.pedidos.some(x=>x.extId===o.extId)) return;      // ya lo tenemos
      const loc=L(); loc.num=(loc.num||0)+1;
      S.pedidos.push({
        id:uid(), num:loc.num, extId:o.extId, origen:'shopify', numeroWeb:o.numero,
        local:S.local, fecha:hoy(), modo:o.modo,
        cliente:o.cliente||'', fono:o.fono||'', dir:o.dir||'', mesa:'',
        items:(o.items||[]).map(i=>({n:i.n,q:i.q,p:i.p,det:i.det||[],nota:i.nota||''})),
        subtotal:(o.items||[]).reduce((a,i)=>a+i.p*i.q,0), pct:0, codigo:'',
        desc:o.descuento||0, envio:o.envio||0, zona:'', total:o.total||0,
        pago:o.pagado?(o.pago||'Pagado en web'):'', propina:0,
        estado:'nuevo', creado:o.creado||Date.now(), tiempos:{}, cerrado:false,
        notaWeb:o.nota||''
      });
      nuevos++;
    });
    ultimoWeb=Date.now(); errorWeb='';
    if(nuevos){
      beep(); beep();
      await guardarYa(); pintarBadge();
      if($('#v-cocina').classList.contains('on')) renderCocina();
      toast(nuevos+' pedido(s) nuevo(s) desde la web');
    } else if(!silencioso) toast('Sin pedidos nuevos');
  }catch(e){
    errorWeb=String(e.message||e);
    if(!silencioso) toast('No se pudo conectar: '+errorWeb);
  }
  sincronizando=false;
}
function arrancarWeb(){
  clearInterval(tWeb);
  const w=cfgWeb();
  if(w.activo && w.url && w.clave){
    sincronizarWeb(true);
    tWeb=setInterval(()=>sincronizarWeb(true), Math.max(10,w.seg||15)*1000);
  }
}
async function responderWeb(p, accion, minutos){
  const w=cfgWeb();
  if(p.extId && w.url && w.clave){
    try{
      await fetch(w.url.replace(/\/$/,'')+'/responder',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({clave:w.clave,extId:p.extId,accion,minutos})});
    }catch(e){ toast('El pedido se procesó, pero no se pudo avisar a la web'); }
  }
}
function aceptarWeb(p){
  $('#modalBox').innerHTML=`
    <h4>Aceptar pedido ${p.numeroWeb||nPed(p)}</h4>
    <div class="sb">${p.cliente||'Cliente'} · ${p.modo}${p.dir?' · '+p.dir:''}</div>
    <div class="g-t">¿En cuánto tiempo está listo?</div>
    <div class="ops">${[15,20,30,40,60].map(m=>`<button class="tam" data-min="${m}">${m} min</button>`).join('')}</div>
    <div class="modal-acc">
      <button class="btn" id="aCancel">Cancelar</button>
      <button class="btn danger" id="aRech">Rechazar pedido</button>
    </div>`;
  $('#modalBox').querySelectorAll('[data-min]').forEach(b=> b.onclick=async()=>{
    const m=+b.dataset.min;
    p.estado='pendiente'; p.promesa=m; p.tiempos.aceptado=Date.now();
    cerrarModal(); await guardarYa(); renderCocina(); pintarBadge();
    responderWeb(p,'aceptar',m);
    toast('Aceptado · listo en '+m+' min');
    if(S.impresora.auto && S.impresora.auto!=='no') setTimeout(()=>imprimir(p,S.impresora.auto),200);
  });
  $('#aCancel').onclick=cerrarModal;
  $('#aRech').onclick=async()=>{
    if(!confirm('¿Rechazar este pedido? Quedará anulado.')) return;
    S.pedidos=S.pedidos.filter(x=>x.id!==p.id);
    cerrarModal(); await guardarYa(); renderCocina(); pintarBadge();
    responderWeb(p,'rechazar');
    toast('Pedido rechazado');
  };
  $('#modal').classList.add('on');
}

/* ================= cocina ================= */
const ESTADOS=[['pendiente','Pendiente'],['prep','En preparación'],['listo','Listo']];
const delDia=()=> S.pedidos.filter(p=>p.fecha===hoy()&&p.local===S.local&&!p.cerrado);

    :p.modo==='local'?`Mesa <b>${p.mesa||'—'}</b>`
    :`Retiro · <b>${p.cliente||'Cliente'}</b>${p.fono?' · '+p.fono:''}`;
  return `<div class="card ${cls} ${tarde?'tarde':''}">
    <div class="c-top">
      <div style="display:flex;align-items:center;gap:9px"><span class="num">#${String(p.num).padStart(3,'0')}</span><span class="modo ${p.modo}">${p.modo}</span></div>
      <span class="crono ${tarde?'tarde':''}">${min} min${p.promesa?` / ${p.promesa}`:''}</span>
    </div>
    <div class="c-body">${p.items.map(i=>`<div class="l"><b>${i.q}×</b><span>${i.n}</span></div>
      ${i.det&&i.det.length?`<div class="o">${i.det.join(' · ')}</div>`:''}
      ${i.nota?`<div class="o">📝 ${i.nota}</div>`:''}`).join('')}</div>
    <div class="c-meta">${dest}<br>${CLP(p.total)}${p.pago?' · '+p.pago:''} · ${hora(p.creado)}</div>
    <div class="c-acc">
      <button class="${p.estado==='listo'?'go':''}" data-a="next" data-id="${p.id}">${sig[1]}</button>
      <button class="sec" data-a="edit" data-id="${p.id}">✎</button>
      <button class="sec" data-a="print" data-id="${p.id}">🖨</button>
      <button class="sec" data-a="del" data-id="${p.id}">✕</button>
    </div></div>`;

function tarjetaNueva(p){
  const min=Math.floor((Date.now()-p.creado)/60000);
  return `<div class="card" style="border-left:4px solid var(--verde)">
    <div class="c-top">
      <div style="display:flex;align-items:center;gap:9px">
        <span class="num">${p.numeroWeb||nPed(p)}</span>
        <span class="modo ${p.modo}">web · ${p.modo}</span>
      </div>
      <span class="crono">${min} min</span>
    </div>
    <div class="c-body">${p.items.map(i=>`<div class="l"><b>${i.q}×</b><span>${i.n}</span></div>
      ${i.det&&i.det.length?`<div class="o">${i.det.join(' · ')}</div>`:''}`).join('')}</div>
    <div class="c-meta">${p.cliente||'Cliente'}${p.fono?' · '+p.fono:''}${p.dir?'<br>'+p.dir:''}
      <br><b>${CLP(p.total)}</b>${p.pago?' · '+p.pago:' · sin pagar'}
      ${p.notaWeb?`<br>📝 ${p.notaWeb}`:''}</div>
    <div class="c-acc"><button class="go" data-a="aceptar" data-id="${p.id}">Aceptar y dar tiempo</button></div>
  </div>`;
}
function renderCocina(){
  const ps=delDia();
  const nuevos=pedidosNuevos();
  const cajaNuevos = (cfgWeb().activo || nuevos.length) ? `
    <div class="panel" style="${nuevos.length?'border-color:var(--verde);box-shadow:0 0 0 2px rgba(63,125,58,.15)':''}">
      <h4 style="display:flex;align-items:center;gap:8px">Nuevos de la web
        ${nuevos.length?`<span class="c" style="background:var(--verde);color:#fff;border-radius:20px;padding:2px 8px">${nuevos.length}</span>`:''}
        <button class="btn" id="c-sync" style="margin-left:auto;padding:6px 12px;font-size:12.5px">Actualizar</button>
      </h4>
      ${nuevos.length
        ? `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px">${nuevos.map(tarjetaNueva).join('')}</div>`
        : `<div style="color:var(--gris);font-size:13.5px">Nada pendiente por aceptar. ${ultimoWeb?'Última revisión '+hora(ultimoWeb):''} ${errorWeb?`<span style="color:var(--brasa)">· ${errorWeb}</span>`:''}</div>`}
    </div>` : '';
  $('#cols').insertAdjacentHTML('beforebegin','');
  const contNuevos=document.getElementById('cont-nuevos');
  if(contNuevos) contNuevos.innerHTML=cajaNuevos;
  $('#cols').innerHTML=ESTADOS.map(([e,t])=>{
    const l=ps.filter(p=>p.estado===e).sort((a,b)=>a.creado-b.creado);
    return `<div><div class="col-h">${t} <span class="c">${l.length}</span></div>
      <div class="col-body">${l.map(tarjeta).join('')||`<div class="col-vacia">Nada acá por ahora</div>`}</div></div>`;
  }).join('');
  const ent=ps.filter(p=>p.estado==='entregado').sort((a,b)=>b.creado-a.creado);
  $('#entregados').innerHTML=ent.length?`<table><tbody>${ent.map(p=>`<tr>
    <td style="font-family:var(--mono);font-weight:700">#${String(p.num).padStart(3,'0')}</td>
    <td>${p.modo}</td><td>${p.cliente||p.mesa||'—'}</td>
    <td class="mono">${hora(p.creado)}</td><td class="mono">${CLP(p.total)}</td>
    <td style="text-align:right;white-space:nowrap">
      <button class="btn" data-a="edit" data-id="${p.id}" style="padding:6px 10px">✎</button>
      <button class="btn" data-a="print" data-id="${p.id}" style="padding:6px 10px">🖨</button></td></tr>`).join('')}</tbody></table>`
    :`<div style="color:var(--gris);font-size:13.5px">Todavía no entregas ningún pedido hoy.</div>`;

  const bs=$('#c-sync'); if(bs) bs.onclick=()=>sincronizarWeb(false);
  document.querySelectorAll('#v-cocina [data-a]').forEach(b=> b.onclick=()=>{
    const p=S.pedidos.find(x=>x.id===b.dataset.id); if(!p) return;
    if(b.dataset.a==='aceptar') return aceptarWeb(p);
    if(b.dataset.a==='print') return pedirImpresion(p);
    if(b.dataset.a==='edit') return editarPedido(p);
    if(b.dataset.a==='del'){
      if(confirm('¿Anular el pedido #'+String(p.num).padStart(3,'0')+'?')){
        S.pedidos=S.pedidos.filter(x=>x.id!==p.id); guardarYa(); renderCocina(); pintarBadge();
      } return;
    }
    const orden={pendiente:'prep',prep:'listo',listo:'entregado'};
    p.estado=orden[p.estado]; p.tiempos[p.estado]=Date.now();
    if(p.estado==='listo') beep();
    guardarYa(); renderCocina(); pintarBadge();
  });
}


/* ================= editar un pedido ya enviado ================= */
function editarPedido(p){
  if(p.cerrado) return toast('Ese pedido está en una caja ya cerrada');
  const loc=S.locales[p.local];
  const e={modo:p.modo,cliente:p.cliente||'',fono:p.fono||'',dir:p.dir||'',mesa:p.mesa||'',
           pago:p.pago||'',pct:p.pct||0,codigo:p.codigo||'',zonaN:p.zona||'',propina:p.propina||0,
           pagos:(p.pagos&&p.pagos.length)?JSON.parse(JSON.stringify(p.pagos)):(p.pago?[{medio:p.pago,monto:p.total}]:[]),
           items:JSON.parse(JSON.stringify(p.items))};
  const zonas=loc.zonas||[];
  if(e.modo==='delivery' && !e.zonaN && zonas.length) e.zonaN=zonas[0].n;
  const cats=[...new Set((loc.menu||[]).map(x=>x.cat))];
  let catAdd=cats[0]||'';

  const pagado = ()=> e.pagos.reduce((a,x)=>a+(Number(x.monto)||0),0);
  const falta = ()=> calc().total - pagado();
  function calc(){
    const sub=e.items.reduce((a,i)=>a+i.p*i.q,0);
    const z=zonas.find(x=>x.n===e.zonaN);
    const env=e.modo==='delivery' ? (z?z.p:(p.envio||0)) : 0;
    const desc=Math.round(sub*(e.pct||0)/100);
    return {sub,env,desc,total:sub-desc+env};
  }
  function guardarCampos(){
    const g=id=>$('#'+id)?$('#'+id).value:undefined;
    if(g('e-cli')!==undefined) e.cliente=g('e-cli');
    if(g('e-fono')!==undefined) e.fono=g('e-fono');
    if(g('e-dir')!==undefined) e.dir=g('e-dir');
    if(g('e-mesa')!==undefined) e.mesa=g('e-mesa');
    if(g('e-pct')!==undefined) e.pct=Math.max(0,Math.min(100,parseInt(g('e-pct'))||0));
    if(g('e-prop')!==undefined) e.propina=Math.max(0,parseInt(g('e-prop'))||0);
  }
  function pinta(){
    const t=calc();
    $('#modalBox').innerHTML=`
      <h4>Editar pedido ${nPed(p)}</h4>
      <div class="sb">Ingresado a las ${hora(p.creado)} · ${p.items.reduce((a,i)=>a+i.q,0)} producto(s)</div>

      <div class="g-t">Cobro ${e.pagos.length>1?`<span>${e.pagos.length} medios</span>`:''}</div>
      ${e.pagos.map((pg,ix)=>`<div class="cnt on">
          <span class="cn">${pg.medio}</span>
          <span class="cc"><input type="number" step="10" value="${pg.monto}" data-pmonto="${ix}"
            style="width:110px;border:1px solid var(--linea);border-radius:7px;padding:7px;text-align:right;background:#fff;font-family:var(--mono)">
            <button data-pdel="${ix}">✕</button></span>
        </div>`).join('')}
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin:6px 0 8px">
        <span>Pagado ${CLP(pagado())}</span>
        <span style="color:${falta()===0?'var(--verde)':'var(--brasa)'}">
          ${falta()>0?'Falta '+CLP(falta()):(falta()<0?'Sobra '+CLP(-falta()):'Cuenta cubierta')}</span>
      </div>
      <div class="ops">${S.pagos.map(pg=>`<button data-padd="${pg}">+ ${pg}</button>`).join('')}</div>
      <div class="ops" style="margin-top:6px">
        <button data-pdiv="2">Dividir en 2</button>
        <button data-pdiv="3">En 3</button>
        <button data-pdiv="4">En 4</button>
        <button data-pclear="1">Limpiar</button>
      </div>

      <div class="g-t">Modalidad</div>
      <div class="ops">${['delivery','local','retiro'].map(m=>`<button class="${e.modo===m?'on':''}" data-modo="${m}" style="text-transform:capitalize">${m}</button>`).join('')}</div>

      <div class="g-t">Datos</div>
      <div class="campos">
        ${e.modo==='local' ? `<input id="e-mesa" placeholder="Mesa" value="${e.mesa}">`
          : `<input id="e-cli" placeholder="Nombre del cliente" value="${e.cliente}">
             <input id="e-fono" placeholder="Teléfono" inputmode="tel" value="${e.fono}">
             ${e.modo==='delivery'?`<input id="e-dir" placeholder="Dirección" value="${e.dir}">
             <select id="e-zona">${zonas.map(z=>`<option ${e.zonaN===z.n?'selected':''}>${z.n} · ${CLP(z.p)}</option>`).join('')}</select>`:''}`}
      </div>

      <div class="g-t">Agregar producto</div>
      <select id="e-cat" style="width:100%;border:1px solid var(--linea);border-radius:8px;padding:9px;background:#fff;font-weight:650">
        ${cats.map(c=>`<option ${catAdd===c?'selected':''}>${c}</option>`).join('')}
      </select>
      <div class="ops" style="margin-top:8px;max-height:150px;overflow:auto">
        ${loc.menu.filter(x=>x.cat===catAdd).map(x=>`<button data-add="${x.id}">${x.n} · ${
          Object.keys(x.precios).length>1 ? Object.entries(x.precios).map(([t,v])=>t+' '+CLP(v)).join(' / ') : CLP(Object.values(x.precios)[0])
        }</button>`).join('')}
      </div>

      <div class="g-t">Productos</div>
      ${e.items.map((i,ix)=>`<div class="cnt">
          <span class="cn">${i.n}${i.det&&i.det.length?`<br><span style="font-size:11.5px;color:var(--gris);font-weight:600">${i.det.join(' · ')}</span>`:''}</span>
          <span class="cc"><button data-it="-" data-ix="${ix}">−</button><b>${i.q}</b><button data-it="+" data-ix="${ix}">+</button>
            <button data-it="x" data-ix="${ix}" style="width:auto;padding:0 8px;font-size:12px">Quitar</button></span>
        </div>`).join('') || `<div style="color:var(--gris);font-size:13.5px">Sin productos: el pedido se anulará.</div>`}

      <div class="g-t">Descuento ${e.codigo?`<span>${e.codigo}</span>`:''}</div>
      <input id="e-pct" class="num-in" type="number" min="0" max="100" step="1" value="${e.pct}" placeholder="% de descuento">

      <div class="g-t">Propina recibida <span>sugerida ${CLP(Math.round(calc().total*(S.impresora.propina||0)/100))}</span></div>
      <div class="ops" style="margin-bottom:7px">
        <button data-prop="0">Sin propina</button>
        <button data-prop="s">Sugerida ${S.impresora.propina||10}%</button>
      </div>
      <input id="e-prop" class="num-in" type="number" min="0" step="100" value="${e.propina}" placeholder="$ de propina">

      <div class="t-tot" style="padding:12px 0 0;border-top:1px dashed var(--linea);margin-top:14px">
        <div class="r"><span>Subtotal</span><span>${CLP(t.sub)}</span></div>
        ${t.desc?`<div class="r" style="color:var(--verde)"><span>Descuento ${e.pct}%</span><span>−${CLP(t.desc)}</span></div>`:''}
        ${t.env?`<div class="r"><span>Delivery · ${e.zonaN}</span><span>${CLP(t.env)}</span></div>`:''}
        <div class="r big"><span>Total</span><span>${CLP(t.total)}</span></div>
        ${e.propina?`<div class="r" style="padding-top:6px"><span>Propina</span><span>${CLP(e.propina)}</span></div>
        <div class="r" style="font-weight:800"><span>Recibido</span><span>${CLP(t.total+e.propina)}</span></div>`:''}
      </div>

      <div class="modal-acc">
        <button class="btn" id="eCancel">Cancelar</button>
        <button class="btn" id="eOkPrint">Guardar e imprimir</button>
        <button class="btn dark" id="eOk">Guardar cambios</button>
      </div>`;

    const box=$('#modalBox');
    box.querySelectorAll('[data-padd]').forEach(b=> b.onclick=()=>{
      guardarCampos();
      const resto=Math.max(0, calc().total - pagado());
      e.pagos.push({medio:b.dataset.padd, monto:resto});
      pinta();
    });
    box.querySelectorAll('[data-pmonto]').forEach(inp=> inp.onchange=()=>{
      e.pagos[+inp.dataset.pmonto].monto=Math.max(0,Number(inp.value)||0); guardarCampos(); pinta();
    });
    box.querySelectorAll('[data-pdel]').forEach(b=> b.onclick=()=>{ guardarCampos(); e.pagos.splice(+b.dataset.pdel,1); pinta(); });
    box.querySelectorAll('[data-pclear]').forEach(b=> b.onclick=()=>{ guardarCampos(); e.pagos=[]; pinta(); });
    box.querySelectorAll('[data-pdiv]').forEach(b=> b.onclick=()=>{
      guardarCampos();
      const n=+b.dataset.pdiv, t=calc().total;
      const base=Math.floor(t/n/10)*10;
      e.pagos=Array.from({length:n},(_,i)=>({medio:e.pagos[i]?e.pagos[i].medio:'Efectivo',
        monto: i===n-1 ? t-base*(n-1) : base}));
      pinta();
    });
    box.querySelectorAll('[data-modo]').forEach(b=> b.onclick=()=>{
      guardarCampos(); e.modo=b.dataset.modo;
      if(e.modo==='delivery' && !e.zonaN && zonas.length) e.zonaN=zonas[0].n;
      pinta();
    });
    box.querySelectorAll('[data-it]').forEach(b=> b.onclick=()=>{
      guardarCampos();
      const ix=+b.dataset.ix, a=b.dataset.it;
      if(a==='+') e.items[ix].q++;
      else if(a==='-'){ e.items[ix].q--; if(e.items[ix].q<=0) e.items.splice(ix,1); }
      else e.items.splice(ix,1);
      pinta();
    });
    const ec=$('#e-cat'); if(ec) ec.onchange=()=>{ guardarCampos(); catAdd=ec.value; pinta(); };
    box.querySelectorAll('[data-add]').forEach(b=> b.onclick=()=>{
      guardarCampos();
      const prod=loc.menu.find(x=>x.id===b.dataset.add); if(!prod) return;
      const necesita = Object.keys(prod.precios).length>1 || (prod.mods||[]).length || (prod.elige||[]).length;
      if(necesita){
        const volver=()=>{ pinta(); $('#modal').classList.add('on'); };
        abrirConfig(prod, null, linea=>{ e.items.push(linea); volver(); }, volver);
      } else {
        const ya=e.items.find(i=>i.n===prod.n && (!i.det||!i.det.length) && !i.nota);
        if(ya) ya.q++; else e.items.push({n:prod.n,p:prod.precios.U,q:1,det:[],nota:''});
        pinta();
      }
    });
    const zn=$('#e-zona'); if(zn) zn.onchange=()=>{ guardarCampos(); e.zonaN=zn.value.split(' · ')[0]; pinta(); };
    const pc=$('#e-pct'); if(pc) pc.onchange=()=>{ guardarCampos(); pinta(); };
    const pr=$('#e-prop'); if(pr) pr.onchange=()=>{ guardarCampos(); pinta(); };
    box.querySelectorAll('[data-prop]').forEach(b=> b.onclick=()=>{
      guardarCampos();
      e.propina = b.dataset.prop==='0' ? 0 : Math.round(calc().total*(S.impresora.propina||10)/100);
      pinta();
    });
    $('#eCancel').onclick=cerrarModal;
    if($('#eOkPrint')) $('#eOkPrint').onclick=()=>aplicar(true);
    $('#eOk').onclick=()=>aplicar(false);
    async function aplicar(imprimirTambien){
      guardarCampos();
      if(!e.items.length){
        if(!confirm('El pedido quedó sin productos. ¿Anularlo?')) return;
        S.pedidos=S.pedidos.filter(x=>x.id!==p.id);
      } else {
        const t2=calc();
        Object.assign(p,{modo:e.modo,cliente:e.cliente.trim(),fono:e.fono.trim(),dir:e.dir.trim(),mesa:e.mesa.trim(),
          pagos:e.pagos.filter(x=>Number(x.monto)>0),
          pago:e.pagos.filter(x=>Number(x.monto)>0).map(x=>x.medio).join(' + '),
          pct:e.pct,desc:t2.desc,envio:t2.env,subtotal:t2.sub,total:t2.total,propina:e.propina||0,
          zona:e.modo==='delivery'?e.zonaN:'',items:e.items,editado:Date.now()});
      }
      await guardarYa(); cerrarModal();
      renderCocina(); pintarBadge();
      if($('#v-caja').classList.contains('on')) renderCaja();
      toast('Pedido actualizado');
      if(imprimirTambien && S.pedidos.some(x=>x.id===p.id)) setTimeout(()=>imprimir(p,'ambas'),200);
    }
  }
  pinta();
  $('#modal').classList.add('on');
}

/* ================= caja ================= */
let fechaCaja = null; // null = hoy
const fechaVista = () => fechaCaja || hoy();
function moverFecha(dias){
  const [a,m,d]=fechaVista().split('-').map(Number);
  const f=new Date(a,m-1,d+dias);
  fechaCaja = f.getFullYear()+'-'+String(f.getMonth()+1).padStart(2,'0')+'-'+String(f.getDate()).padStart(2,'0');
  renderCaja();
}
function fechaLarga(k){
  const [a,m,d]=k.split('-').map(Number);
  return new Date(a,m-1,d).toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});
}
function resumenDia(fecha, local){
  const ps=S.pedidos.filter(p=>p.fecha===fecha && p.local===local);
  const v=ps.filter(p=>p.estado==='entregado');
  const productos=v.reduce((a,p)=>a+(p.subtotal||0)-(p.desc||0),0);
  const envios=v.reduce((a,p)=>a+(p.envio||0),0);
  const propinas=v.reduce((a,p)=>a+(p.propina||0),0);
  // Las propinas no son ingreso del local: van aparte y NO suman al recaudado.
  return {ps,v,productos,envios,propinas,total:productos+envios,recaudado:productos+envios};
}
function renderCaja(){
  const f=fechaVista(), esHoy=f===hoy();
  const R=resumenDia(f,S.local);
  const ps=R.ps, v=R.v;
  const prom=v.length?R.total/v.length:0;
  const porModo={},porPago={},prods={};
  v.forEach(p=>{ porModo[p.modo]=(porModo[p.modo]||0)+p.total;
    if(p.pagos&&p.pagos.length) p.pagos.forEach(x=>porPago[x.medio]=(porPago[x.medio]||0)+(Number(x.monto)||0));
    else { const k=p.pago||'Sin registrar'; porPago[k]=(porPago[k]||0)+p.total; }
    p.items.forEach(i=>prods[i.n]=(prods[i.n]||0)+i.q); });
  const top=Object.entries(prods).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxTop=top.length?top[0][1]:1;

  // días del mes con ventas
  const mes=f.slice(0,7);
  const dias=[...new Set(S.pedidos.filter(p=>p.local===S.local&&p.fecha.startsWith(mes)).map(p=>p.fecha))].sort().reverse();
  const totalMes=dias.reduce((a,d)=>a+resumenDia(d,S.local).recaudado,0);
  const totalPropMes=dias.reduce((a,d)=>a+resumenDia(d,S.local).propinas,0);

  $('#v-caja').innerHTML=`
    <div class="panel" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <button class="btn" id="f-prev">◀</button>
      <input type="date" id="f-fecha" value="${f}" style="border:1px solid var(--linea);border-radius:8px;padding:10px;background:#fff;font-weight:700">
      <button class="btn" id="f-next" ${esHoy?'disabled style="opacity:.4"':''}>▶</button>
      ${!esHoy?`<button class="btn dark" id="f-hoy">Ir a hoy</button>`:''}
      <span style="margin-left:auto;font-size:13px;color:var(--gris);text-transform:capitalize;font-weight:650">${fechaLarga(f)}</span>
    </div>

    <div class="kpis">
      <div class="kpi destaca"><div class="k">Recaudado · sin propinas</div><div class="v">${CLP(R.recaudado)}</div></div>
      <div class="kpi"><div class="k">Venta de productos</div><div class="v">${CLP(R.productos)}</div></div>
      <div class="kpi"><div class="k">Envíos cobrados</div><div class="v">${CLP(R.envios)}</div></div>
      <div class="kpi" style="border-color:var(--verde)"><div class="k">Propinas · aparte</div><div class="v">${CLP(R.propinas)}</div></div>
      <div class="kpi"><div class="k">Pedidos entregados</div><div class="v">${v.length}</div></div>
      <div class="kpi"><div class="k">Ticket promedio</div><div class="v">${CLP(prom)}</div></div>
    </div>

    <div class="panel"><h4>Por modalidad</h4>
      ${['delivery','local','retiro'].map(m=>`<div style="margin-bottom:9px">
        <div style="display:flex;justify-content:space-between;font-size:13.5px">
          <span style="text-transform:capitalize;font-weight:650">${m}</span>
          <span style="font-family:var(--mono)">${CLP(porModo[m]||0)}</span></div>
        <div class="barra"><i style="width:${R.total?(porModo[m]||0)/R.total*100:0}%"></i></div></div>`).join('')}
    </div>

    <div class="panel"><h4>Por método de pago</h4>
      <table><tbody>${Object.entries(porPago).length?Object.entries(porPago).map(([k,val])=>`<tr><td>${k}</td><td class="mono">${CLP(val)}</td></tr>`).join('')
        :`<tr><td style="color:var(--gris)">Sin ventas registradas</td></tr>`}</tbody></table></div>

    <div class="panel"><h4>Lo más vendido</h4>
      ${top.length?top.map(([n,q])=>`<div style="margin-bottom:9px">
        <div style="display:flex;justify-content:space-between;font-size:13.5px"><span style="font-weight:650">${n}</span><span style="font-family:var(--mono)">${q}</span></div>
        <div class="barra"><i style="width:${q/maxTop*100}%"></i></div></div>`).join('')
        :`<div style="color:var(--gris);font-size:13.5px">Sin productos vendidos este día.</div>`}</div>

    <div class="panel"><h4>Detalle del día</h4>
      <table><thead><tr><th>N°</th><th>Hora</th><th>Modalidad</th><th>Cliente / mesa</th><th>Pago</th><th>Estado</th><th class="mono">Envío</th><th class="mono">Propina</th><th class="mono">Total</th><th></th></tr></thead>
      <tbody>${ps.slice().sort((a,b)=>b.creado-a.creado).map(p=>`<tr>
        <td style="font-family:var(--mono);font-weight:700">#${String(p.num).padStart(3,'0')}</td>
        <td class="mono" style="text-align:left">${hora(p.creado)}</td>
        <td style="text-transform:capitalize">${p.modo}</td>
        <td>${p.cliente||p.mesa||'—'}</td>
        <td>${p.pago||'<span style="color:var(--brasa)">sin registrar</span>'}</td>
        <td>${p.estado==='prep'?'En preparación':p.estado[0].toUpperCase()+p.estado.slice(1)}${p.cerrado?' 🔒':''}</td>
        <td class="mono">${p.envio?CLP(p.envio):'—'}</td>
        <td class="mono">${p.propina?CLP(p.propina):'—'}</td>

function exportar(ps, etiqueta){
  const filas=[['N','Fecha','Hora','Local','Modalidad','Cliente','Mesa','Direccion','Telefono','Zona','Detalle','Subtotal','Descuento','Delivery','Propina','Total','Pago','Estado']];
  ps.forEach(p=>filas.push([p.num,p.fecha,hora(p.creado),S.locales[p.local].nombre,p.modo,p.cliente,p.mesa,p.dir,p.fono,p.zona||'',
    p.items.map(i=>`${i.q}x ${i.n}${i.det&&i.det.length?' ('+i.det.join(', ')+')':''}`).join(' | '),
    p.subtotal,p.desc,p.envio,p.propina||0,p.total,
    (p.pagos&&p.pagos.length)?p.pagos.map(x=>`${x.medio}: ${x.monto}`).join(' | '):(p.pago||''),p.estado]));
  const csv=filas.map(f=>f.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  a.download=`ventas-${S.local}-${etiqueta||hoy()}.csv`; a.click(); toast('CSV descargado');
}


/* ================= CUADRE (planilla de cierre) ================= */
// Junaeb va dentro de Local: se muestra aparte como referencia y NO se suma al total.
const CANALES=[['pedidosya','Pedidos Ya',1],['local','Local',1],['junaeb','Junaeb',0],['uber','Uber Eats',1],['rappi','Rappi',1]];
const COBROS=[['transferencias','Transferencias'],['getnet','R/C Getnet'],['junaeb','Junaeb'],
              ['pycupon','Py Cupón'],['pyonline','Py Online'],['uber','Uber Eats'],['rappi','Rappi']];
const claveCuadre = f => S.local+'|'+f;

function cuadreVacio(){
  return {canales:{},cobros:{},repartos:0,efectivoContado:null,propinas:0,
          nCocina:0,nGarzones:0,gastos:[],nota:''};
}
function getCuadre(f){
  const k=claveCuadre(f);
  if(!S.cuadres[k]) S.cuadres[k]=cuadreVacio();
  const c=S.cuadres[k];
  if(!c.canales) c.canales={}; if(!c.cobros) c.cobros={}; if(!c.gastos) c.gastos=[];
  return c;
}
// Lo que el sistema registró ese día, mapeado a los casilleros de la planilla
function delSistema(f){
  const v=S.pedidos.filter(p=>p.fecha===f&&p.local===S.local&&p.estado==='entregado');
  const canales={},cobros={};
  let repartos=0, propinas=0;
  v.forEach(p=>{
    repartos+=p.envio||0; propinas+=p.propina||0;
    // el pedido puede estar pagado con varios medios a la vez
    const partes=(p.pagos&&p.pagos.length)?p.pagos:[{medio:p.pago||'',monto:p.total}];
    const canalDe=m=>{ const x=m.toLowerCase();
      if(x.includes('pedidos')) return 'pedidosya';
      if(x.includes('uber')) return 'uber';
      if(x.includes('rappi')) return 'rappi';
      return 'local'; };
    partes.forEach(pt=>{
      const m=(pt.medio||'').toLowerCase(), monto=Number(pt.monto)||0;
      canales[canalDe(m)]=(canales[canalDe(m)]||0)+monto;
      if(m.includes('junaeb')) canales.junaeb=(canales.junaeb||0)+monto; // referencia, ya contado en Local
      if(m.includes('transfer')) cobros.transferencias=(cobros.transferencias||0)+monto;
      else if(m.includes('getnet')||m.includes('débito')||m.includes('debito')||m.includes('crédito')||m.includes('credito')) cobros.getnet=(cobros.getnet||0)+monto;
      else if(m.includes('junaeb')) cobros.junaeb=(cobros.junaeb||0)+monto;
      else if(m.includes('pedidos')) cobros.pyonline=(cobros.pyonline||0)+monto;
      else if(m.includes('uber')) cobros.uber=(cobros.uber||0)+monto;
      else if(m.includes('rappi')) cobros.rappi=(cobros.rappi||0)+monto;
    });
  });
  return {canales,cobros,repartos,propinas,pedidos:v.length};
}

  const c=getCuadre(f), sis=delSistema(f);

        <div class="panel"><h4>Cobros</h4>

            ${COBROS.map(([k,l])=>fila(k,l,'cobros',sis.cobros[k])).join('')}

      <div>

          ${dif!==null&&dif!==0?`<div style="font-size:12.5px;color:var(--brasa);font-weight:650;margin-top:8px">${dif>0?'Sobra':'Falta'} ${CLP(Math.abs(dif))} en caja.</div>`:''}

        <div class="panel"><h4>Propinas</h4>
          <table><tbody>

              <td class="mono"><input id="c-prop" type="number" step="100" value="${c.propinas??''}" placeholder="0"

  $('#v-menu').querySelectorAll('.m-row[data-id]').forEach(row=>{
    const p=loc.menu.find(x=>x.id===row.dataset.id);
    row.querySelector('.n-in').onchange=e=>{p.n=e.target.value.trim()||p.n;guardar();refrescarPedido();};
    const setPrecios=()=>{
      const m=parseInt(row.querySelector('.p-in').value)||0;
      const x=parseInt(row.querySelector('.xl-in').value)||0;
      p.precios = x ? {M:m,XL:x} : {U:m};
      guardar(); refrescarPedido();
    };
    row.querySelector('.p-in').onchange=setPrecios;
    row.querySelector('.xl-in').onchange=setPrecios;
    row.querySelector('.cat-in').onchange=e=>{p.cat=e.target.value.trim()||p.cat;guardar();renderMenuAdmin();refrescarPedido();};
    row.querySelector('.del').onclick=()=>{
      if(!confirm('¿Eliminar "'+p.n+'"?'))return;
      loc.menu=loc.menu.filter(x=>x.id!==p.id);guardar();renderMenuAdmin();refrescarPedido();
    };
  });
  $('#a-go').onclick=()=>{
    const n=$('#a-n').value.trim(),m=parseInt($('#a-p').value)||0,x=parseInt($('#a-x').value)||0,c=$('#a-c').value.trim()||'Otros';
    if(!n) return toast('Escribe el nombre del producto');
    loc.menu.push({id:uid(),cat:c,n,precios:x?{M:m,XL:x}:{U:m},mods:x?['proteina','salsas']:[]});
